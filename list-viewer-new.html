<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>My Lists</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css?v=48">
  <script src="theme.js"></script>
  <script src="share.js"></script>
  <script src="photos.js"></script>
  <script src="lookup.js"></script>
  <script src="swipe-close.js"></script>
  <script src="photo-ui.js"></script>
  <script src="sendcard.js"></script>
  <meta name="theme-color" content="#0F1013">
</head>

<body class="app-body">

  <!-- Icon sprite -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <defs>
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1v-9z"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.3" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
      <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18M8 5v4M13 5v4M18 5v4"/></symbol>
      <symbol id="i-food" viewBox="0 0 24 24"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 1.5-3 4-3 7h3v11"/></symbol>
      <symbol id="i-cup" viewBox="0 0 24 24"><path d="M6 3h12l-1.5 17a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1L6 3zM6.5 9h11"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.5 5.5L20 9l-4 4 1 6-5-3-5 3 1-6-4-4 5.5-.5L12 3z"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
    </defs>
  </svg>

  <div class="app-wrap">

    <div class="screen-head">
      <button id="backBtn" class="back-btn" style="display:none;" onclick="showAllLists()" aria-label="Back to all lists">
        <svg class="ic"><use href="#i-back"/></svg>
      </button>
      <div class="grow">
        <h1 class="screen-title" id="listTitle">My lists</h1>
        <div class="screen-sub" id="listSub"></div>
      </div>
      <button id="shareListBtn" class="btn-accent" style="display:none;height:44px;padding:0 18px;" onclick="shareList()">Share</button>
      <button id="newListBtn" class="btn-accent" style="height:44px;padding:0 18px;" onclick="window.location.href='index.html#newlist'">
        <svg class="ic" style="width:18px;height:18px"><use href="#i-plus"/></svg> New
      </button>
    </div>

    <div id="listFilters" class="chip-row" style="padding-top:0;margin-bottom:14px;">
      <button class="chip is-active" data-filter="All" onclick="setFilter('All')">All</button>
      <button class="chip" data-filter="Drinks" onclick="setFilter('Drinks')">Drinks</button>
      <button class="chip" data-filter="Cinema" onclick="setFilter('Cinema')">Cinema</button>
      <button class="chip" data-filter="Food" onclick="setFilter('Food')">Food</button>
      <button class="chip" data-filter="Other" onclick="setFilter('Other')">Other</button>
      <button class="chip" data-filter="Checked" onclick="setFilter('Checked')">Checked</button>
    </div>

    <div id="listsContainer"></div>

  </div>

  <!-- Bottom tab bar (same as the home page) -->
  <nav class="tabbar" aria-label="Main">
    <button class="tab" onclick="goHome()"><svg class="ic"><use href="#i-home"/></svg><span>Home</span></button>
    <button class="tab" onclick="window.location.href='index.html#search'"><svg class="ic"><use href="#i-search"/></svg><span>Search</span></button>
    <button class="tab active" onclick="showAllLists()"><svg class="ic"><use href="#i-list"/></svg><span>My lists</span></button>
    <button class="tab" onclick="window.location.href='index.html#more'"><svg class="ic"><use href="#i-more"/></svg><span>More</span></button>
  </nav>

  <!-- Delete confirmation -->
  <div id="deleteModal" class="modal fade" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content bg-dark text-white">
        <div class="modal-body text-center">
          <p id="deleteMessage">Are you sure?</p>
          <button id="confirmDelete" class="btn btn-danger mt-2">Delete</button>
          <button class="btn btn-secondary mt-2" data-bs-dismiss="modal">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>

	const categoryIcons = {
	  Drinks: "i-cup",
	  Cinema: "i-film",
	  Food: "i-food",
	  Other: "i-star",
	  Checked: "i-check",
	  Uncategorized: "i-list"
	};

	function escHtml(value) {
	  return String(value ?? "")
		.replace(/&/g, "&amp;")
		.replace(/</g, "&lt;")
		.replace(/>/g, "&gt;")
		.replace(/"/g, "&quot;")
		.replace(/'/g, "&#39;");
	}

	let currentFilter = "All";

	function setFilter(category) {
	  currentFilter = category;

	  // Leave single-list mode if a list is open
	  localStorage.removeItem("currentList");

	  const container = document.getElementById("listsContainer");
	  container.classList.add("fade-out-soft");

	  setTimeout(() => {
		loadLists();
		container.classList.remove("fade-out-soft");
	  }, 150);
	}

	function showAllLists() {
	  localStorage.removeItem("currentList");
	  loadLists();
	  window.scrollTo({ top: 0, behavior: "smooth" });
	}

	let deleteCallback = null;

	function showDeleteModal(message, callback) {
	  document.getElementById("deleteMessage").textContent = message;
	  deleteCallback = callback;

	  const modal = new bootstrap.Modal(document.getElementById("deleteModal"));
	  modal.show();

	  document.getElementById("confirmDelete").onclick = () => {
		callback();
		modal.hide();
		document.activeElement.blur();
	  };
	}

	function createGoogleLink(query) {
	  if (!query) return "https://www.google.com";
	  return `https://www.google.com/search?q=${encodeURIComponent(query)}`;
	}

	function createGoogleMapsLink(query) {
	  if (!query) return "https://www.google.com/maps";
	  return `https://www.google.com/maps/search/${encodeURIComponent(query)}`;
	}

	function toggleCheckList(button) {
	  const id = button.dataset.id;

	  const lists = JSON.parse(localStorage.getItem("lists")) || {};
	  const entries = JSON.parse(localStorage.getItem("entries")) || [];

	  const selected = localStorage.getItem("currentList");
	  if (!selected || !lists[selected]) return;

	  const item = lists[selected].items.find(e => e.id == id);
	  if (!item) return;

	  const isChecked = !item.checked;
	  item.checked = isChecked;

	  const entry = entries.find(e => e.id == id);
	  if (entry) { entry.checked = isChecked; if (isChecked) entry.checkedAt = new Date().toISOString(); else delete entry.checkedAt; }

	  localStorage.setItem("lists", JSON.stringify(lists));
	  localStorage.setItem("entries", JSON.stringify(entries));

	  loadLists();
	}

	// One card per entry inside an opened list
	function formatEntry(entry) {

	  let content = "";
	  let googleSearchLink = "";
	  let googleMapsLink = "";

	  if (entry.type === "Drinks") {
		googleSearchLink = createGoogleLink(entry.placeName);
		googleMapsLink = createGoogleMapsLink(entry.placeName);

		content = `
		  <div class="entry-info">
			<div>🥤 ${escHtml(entry.placeName)}</div>
			<div>Region: ${escHtml(entry.drinkType)}</div>
			<div>⭐ ${escHtml(entry.Rating || "N/A")}</div>
		  </div>
		`;
	  }

	  else if (entry.type === "Cinema") {
		googleSearchLink = createGoogleLink(entry.movieName);
		googleMapsLink = createGoogleMapsLink(entry.cinemaName);

		content = `
		  <div class="entry-info">
			<div>${Share.isTV(entry) ? "📺" : "🎬"} ${escHtml(entry.movieName)}</div>
			<div>${Share.isTV(entry) ? "TV series" : "Cinema"}: ${escHtml(entry.cinemaName)}${entry.year ? " · " + escHtml(entry.year) : ""}</div>
			${Share.isTV(entry) ? `<div class="entry-meta"><span class="tv-pill tv-${Share.tvStatus(entry)}">${Share.TV_STATUS[Share.tvStatus(entry)]}</span>${Share.tvProgress(entry) ? " <b>" + escHtml(Share.tvProgress(entry)) + "</b>" : ""}</div>` : ""}
			<div>⭐ ${escHtml(entry.Rating || "N/A")}</div>
		  </div>
		`;
	  }

	  else if (entry.type === "Food") {
		googleSearchLink = createGoogleLink(entry.placeName);
		googleMapsLink = createGoogleMapsLink(entry.placeName);

		content = `
		  <div class="entry-info">
			<div>🍽️ ${escHtml(entry.placeName)}</div>
			<div>Cuisine: ${escHtml(entry.cuisineType)}</div>
			<div>⭐ ${escHtml(entry.Rating || "N/A")}</div>
		  </div>
		`;
	  }

	  else if (entry.type === "Other") {
		googleSearchLink = createGoogleLink(entry.otherName);
		googleMapsLink = createGoogleMapsLink(entry.otherName);

		content = `
		  <div class="entry-info">
			<div>🧩 ${escHtml(entry.otherName)}</div>
			<div>Type: ${escHtml(entry.otherType)}</div>
			<div>⭐ ${escHtml(entry.Rating || "N/A")}</div>
		  </div>
		`;
	  }

	  const entrySummary = buildEntrySummary(entry);

	  return `
		<li class="list-group-item bg-dark text-white entry-item">

		  <div class="entry-header">
			${Photos.thumbHtml(entry, '', "PhotoUI.openEntry('" + escHtml(entry.id) + "')")}
			${content}

			<button class="check-btn action-btn ${entry.checked ? 'checked' : ''}"
					data-id="${escHtml(entry.id)}"
					aria-label="Mark as done"
					onclick="toggleCheckList(this)">
			  <i class="fa-solid ${entry.checked ? 'fa-check-circle' : 'fa-check'}"></i>
			</button>
		  </div>

		  <div class="button-group">

			<a href="${googleSearchLink}" target="_blank" rel="noopener" class="icon-btn" aria-label="Search on Google">
			  <img src="https://www.google.com/favicon.ico" alt="">
			</a>

			<a href="${googleMapsLink}" target="_blank" rel="noopener" class="icon-btn">📍 Map</a>

			<button class="icon-btn" aria-label="Photos" onclick="PhotoUI.openEntry('${escHtml(entry.id)}')">📷</button>

			<button class="icon-btn" aria-label="Share"
					data-share="${escHtml(entrySummary)}"
					onclick="SendCard.openSheet('e', '${escHtml(String(entry.id))}', this.dataset.label)" data-label="${escHtml(Share.nameOf(entry))}">🔗</button>

			<button class="icon-btn" aria-label="Remove from list"
					onclick="deleteItem(localStorage.getItem('currentList'), ${Number(entry.index)})">
			  <i class="fa-solid fa-trash"></i>
			</button>

		  </div>

		</li>
	  `;
	}


	function buildEntrySummary(entry) {
	  if (entry.type === "Cinema") {
		if (Share.isTV(entry)) return `📺 Series: ${entry.movieName}${Share.tvProgress(entry) ? " (" + Share.tvProgress(entry) + ")" : ""}, Genre: ${entry.cinemaName}, ⭐: ${entry.Rating || 'N/A'}`;
		return `🎬 Movie: ${entry.movieName}, Cinema: ${entry.cinemaName}, ⭐: ${entry.Rating || 'N/A'}`;
	  } else if (entry.type === "Drinks") {
		return `🥤 Place: ${entry.placeName}, Region: ${entry.drinkType}, ⭐: ${entry.Rating || 'N/A'}`;
	  } else if (entry.type === "Food") {
		return `🍽️ Place: ${entry.placeName}, Cuisine: ${entry.cuisineType}, ⭐: ${entry.Rating || 'N/A'}`;
	  } else if (entry.type === "Other") {
		return `🧩 Other: ${entry.otherName}, Description: ${entry.otherType}, ⭐: ${entry.Rating || 'N/A'}`;
	  }

	  return "Unknown entry";
	}

	// This page didn't have a share function before (the 🔗 button did nothing here)
	function shareEntry(text) { Share.send(text, "Shared Entry"); }

	// Share the open list as a clean message (uses your latest version of each entry)
	function shareList() {
	  const name = localStorage.getItem("currentList");
	  const lists = JSON.parse(localStorage.getItem("lists")) || {};
	  const entries = JSON.parse(localStorage.getItem("entries")) || [];
	  if (!name || !lists[name]) return;
	  const items = (lists[name].items || []).map(it => entries.find(e => e.id == it.id) || it);
	  if (!items.length) { Share.toast("Add something to the list first."); return; }
	  SendCard.openSheet("l", name, name);
	}


	// ---- Status (plan / watching / watched) for films inside a list ----
  // A list keeps its own copy of each film, so the live entry is found by type + name.
  var listStatusFilter = "All";
  function entryKey(e) { return e.type + "|" + String(e.type === "Cinema" ? e.movieName : e.placeName || "").trim().toLowerCase(); }
  function entryIndex() {
    var m = new Map();
    try {
      (JSON.parse(localStorage.getItem("entries")) || []).forEach(function (e) { var k = entryKey(e); if (!m.has(k)) m.set(k, e); });
    } catch (err) {}
    return m;
  }
  function statusOf(item, idx) {
    var live = idx.get(entryKey(item));
    if (live ? live.checked : item.checked) return "watched";
    var s = live ? live.tvStatus : null;
    if (s === "plan") return "plan";
    if (s === "watching" || s === "paused") return "watching";
    return "none";
  }
  function statusChipsHtml(tagged) {
    var c = { All: tagged.length, plan: 0, watching: 0, watched: 0 };
    tagged.forEach(function (t) { if (c[t.st] !== undefined) c[t.st]++; });
    var defs = [["All", "All"], ["plan", "Plan"], ["watching", "Watching"], ["watched", "Watched"]];
    return '<div style="display:flex;gap:8px;overflow-x:auto;padding:4px 0 12px">' +
      defs.map(function (d) { return '<button type="button" class="chip' + (listStatusFilter === d[0] ? ' is-active' : '') + '" onclick="setListStatus(\'' + d[0] + '\')">' + d[1] + ' ' + c[d[0]] + '</button>'; }).join("") +
      '</div>';
  }
  function statusSummary(items) {
    var idx = entryIndex(), c = { plan: 0, watching: 0, watched: 0 };
    items.forEach(function (it) { var s = statusOf(it, idx); if (c[s] !== undefined) c[s]++; });
    return " · " + c.plan + " plan · " + c.watching + " watching · " + c.watched + " watched";
  }
  function setListStatus(s) { listStatusFilter = s; loadLists(); }

  function loadLists() {
	  const container = document.getElementById("listsContainer");
	  const title = document.getElementById("listTitle");
	  const sub = document.getElementById("listSub");
	  const backBtn = document.getElementById("backBtn");
	  const newListBtn = document.getElementById("newListBtn");
	  const filters = document.getElementById("listFilters");

	  const lists = JSON.parse(localStorage.getItem("lists")) || {};
	  let selected = localStorage.getItem("currentList");

	  // The open list was deleted somewhere else → go back to the overview
	  if (selected && !lists[selected]) {
		localStorage.removeItem("currentList");
		selected = null;
	  }

	  // MODE B: Show only the selected list
	  if (selected) {
		const items = lists[selected].items || [];

		title.textContent = selected;
		title.classList.add("sm");
		sub.textContent = items.length + (items.length === 1 ? " item" : " items");
		backBtn.style.display = "flex";
		newListBtn.style.display = "none";
		document.getElementById("shareListBtn").style.display = "";
		filters.style.display = "none";

		const view = (function () { try { return localStorage.getItem("listView") || "list"; } catch (e) { return "list"; } })();
		const idx = entryIndex();
		const tagged = items.map((item, i) => ({ item: item, index: i, st: statusOf(item, idx) }));
		const isCinema = lists[selected].category === "Cinema";
		const shown = (isCinema && listStatusFilter !== "All") ? tagged.filter(t => t.st === listStatusFilter) : tagged;
		const chips = isCinema ? statusChipsHtml(tagged) : "";
		if (!items.length) {
		  container.innerHTML = `<p class="empty-note">Nothing in this list yet.</p>`;
		} else if (view === "gallery") {
		  container.innerHTML = PhotoUI.viewToggleHtml(view, "setListView") + chips + PhotoUI.galleryHtml(shown.map(t => t.item));
		  Photos.hydrate(container);
		} else {
		  container.innerHTML = PhotoUI.viewToggleHtml(view, "setListView") + chips + 
			(shown.length ? `<ul class="list-group">${shown.map(t => formatEntry({ ...t.item, index: t.index })).join("")}</ul>` : `<p class="empty-note">Nothing with this status.</p>`);
		}
		return;
	  }

	  // MODE A: Show all lists
	  title.textContent = "My lists";
	  title.classList.remove("sm");
	  sub.textContent = "";
	  backBtn.style.display = "none";
	  newListBtn.style.display = "";
	  document.getElementById("shareListBtn").style.display = "none";
	  filters.style.display = "";

	  document.querySelectorAll("#listFilters .chip").forEach(chip => {
		chip.classList.toggle("is-active", chip.dataset.filter === currentFilter);
	  });

	  if (Object.keys(lists).length === 0) {
		container.innerHTML = `<p class="empty-note">No lists yet. Tap New to create one.</p>`;
		return;
	  }

	  let html = "";
	  for (const listName in lists) {
		const list = lists[listName];

		// FILTER LOGIC
		const category = list.category || "Uncategorized";
		if (currentFilter !== "All" && category !== currentFilter) {
		  continue;
		}

		const count = list.items?.length || 0;
		const tileClass = "tile-" + category.toLowerCase();
		const iconId = categoryIcons[category] || "i-list";

		// A list can carry its own custom icon (emoji); otherwise use the category icon
		const tileInner = list.icon
		  ? escHtml(list.icon)
		  : `<svg class="ic"><use href="#${iconId}"/></svg>`;

		html += `
		  <div class="list-card list-animate" data-name="${escHtml(listName)}" onclick="openList(this.dataset.name)">
			<div class="list-tile ${tileClass}">${tileInner}</div>

			<div class="list-meta">
			  <div class="list-name">${escHtml(listName)}</div>
			  <div class="list-count">${count} ${count === 1 ? "item" : "items"} · ${escHtml(category)}${category === "Cinema" ? statusSummary(list.items || []) : ""}</div>
			</div>

			<button class="icon-btn danger" aria-label="Delete list"
					onclick="event.stopPropagation(); deleteList(this.closest('.list-card').dataset.name)">
			  <i class="fa-solid fa-trash"></i>
			</button>
		  </div>
		`;
	  }

	  container.innerHTML = html || `<p class="empty-note">No lists in this category.</p>`;
	}


	function setListView(v) {
	  try { localStorage.setItem("listView", v); } catch (e) {}
	  loadLists();
	}

	function openList(listName) {
	  localStorage.setItem("currentList", listName);
	  loadLists();
	  window.scrollTo({ top: 0 });
	}


	function deleteItem(listName, index) {
	  showDeleteModal("Delete this item from list?", () => {
		const lists = JSON.parse(localStorage.getItem("lists")) || {};
		// delete from items array
		lists[listName].items.splice(index, 1);
		// If list becomes empty, delete it
		if (lists[listName].items.length === 0) {
		  delete lists[listName];
		  localStorage.removeItem("currentList");
		}

		localStorage.setItem("lists", JSON.stringify(lists));
		loadLists();
	  });
	}


	function deleteList(listName) {
	  showDeleteModal(`Delete the list "${listName}"?`, () => {
		const lists = JSON.parse(localStorage.getItem("lists")) || {};
		delete lists[listName];

		if (localStorage.getItem("currentList") === listName) {
		  localStorage.removeItem("currentList");
		}

		localStorage.setItem("lists", JSON.stringify(lists));
		loadLists();
	  });
	}


	function goHome() {
	  document.body.classList.add('fade-out');
	  setTimeout(() => {
		window.location.href = 'index.html';
	  }, 300);
	}

	window.addEventListener("DOMContentLoaded", () => {
	  loadLists();
	});

</script>

</body>
</html>
